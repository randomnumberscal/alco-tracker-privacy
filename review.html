<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Alco Tracker Review Access</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #4b5563;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 22px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-weight: bold;
    }

    .code {
      margin-top: 22px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 10px;
      word-break: break-all;
      font-family: monospace;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Alco Tracker</h1>

    <p>
      Google Play Review Access
    </p>

    <p>
      This page provides Google Play reviewers with access
      to all Premium features without requiring a purchase
      or free trial.
    </p>

    <a
      class="button"
      href="alcotracker://review?code=ALCO-GP-REVIEW-7K4M9Q2X6P8N"
    >
      Open Alco Tracker Review Access
    </a>

    <div class="code">
      alcotracker://review?code=ALCO-GP-REVIEW-7K4M9Q2X6P8N
    </div>
  </div>
</body>
</html>
